name: Build Geode Mod

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Geode mod
        uses: geode-sdk/build-geode-mod@main
        with:
          target: Android64
          sdk: v4.0.0

      - name: Upload Geode mod
        uses: actions/upload-artifact@v4
        with:
          name: GD-Deco-AI
          path: ${{ steps.build.outputs.build-output }}
